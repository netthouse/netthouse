[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netthouse"
version = "0.1.0"
description = "Netthouse x402 client SDK - pay for HTTP resources with USDC"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Netthouse" }]
keywords = ["x402", "payments", "usdc", "base", "ai-agents", "web3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
    "eth-account>=0.11",
]

[project.urls]
Homepage = "https://netthouse.com/docs"
Documentation = "https://netthouse.com/docs"
Repository = "https://github.com/Zhasulan391/sdk-python"

[tool.setuptools]
packages = ["netthouse"]